[project]
name = "contentpulse-backend"
version = "0.1.0"
description = "ContentPulse API — AI-assisted content intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pgvector>=0.3.6",
    "pyjwt[crypto]>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "httpx>=0.28",
    "tzdata>=2026.4",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "anthropic>=1.11.0",
    "boto3>=1.43.107",
    "celery[redis]>=5.5",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Fixture payloads and assertions read better unwrapped.
"tests/*" = ["E501"]
# Reuses the alignment tests' fixtures, which pytest injects by parameter name.
"tests/test_topics.py" = ["E501", "F811"]
"tests/test_content.py" = ["E501", "F811"]
"tests/test_design.py" = ["E501", "F811"]
"tests/test_approvals.py" = ["E501", "F811"]
"tests/test_operations.py" = ["E501", "F811"]
"tests/test_blog.py" = ["E501", "F811"]
"tests/test_design_logo.py" = ["E501", "F811"]
"tests/test_dashboard.py" = ["E501", "F811"]
