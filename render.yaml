# Render Blueprint: the FastAPI backend only, on Render's FREE plan
# (docs/deploy-vercel.md). The website runs on Vercel and reaches this service
# through its /api/v1 rewrite (API_URL). Database: Supabase Postgres (free).
# Files: Supabase Storage (S3-compatible).
#
# Free-plan notes:
# - One web service and nothing else. Background jobs and the trend scheduler
#   run inside the API process (TASK_BACKEND=inprocess), so no worker, Redis or
#   Render database is needed (workers have no free plan; Redis and Postgres
#   would add paid or expiring resources).
# - The service sleeps after 15 minutes without traffic and takes about a
#   minute to wake. Scheduled trend discovery only runs while it's awake.
#   Change `plan: free` to `plan: starter` later to keep it always on.
# - Pre-deploy commands need a paid plan, so migrations run at start-up.
#
# Values marked `sync: false` are asked for when you create the Blueprint
# (Render dashboard > New > Blueprint) and are never stored in git. Leave
# optional ones empty.
services:
  - type: web
    name: contentpulse-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # https://<your-project>.vercel.app (or your custom domain)
      - key: FRONTEND_URL
        sync: false
      # The same URL as a JSON list: ["https://<your-project>.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Supabase > Connect > Session pooler (port 5432). Paste it as shown.
      - key: DATABASE_URL
        sync: false
      # Browser -> Vercel -> Render -> API: the client is the 2nd address from the right.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: COOKIE_SECURE
        value: "true"
      - key: TASK_BACKEND
        value: inprocess
      - key: TREND_SCHEDULER_ENABLED
        value: "true"
      # One instance and no Redis: limits live in memory.
      - key: RATE_LIMIT_BACKEND
        value: memory
      - key: LLM_LIMITER_BACKEND
        value: memory

      # Sign-in: "local" (email + password, no setup) or "supabase" (Supabase Auth;
      # then also set SUPABASE_URL and SUPABASE_ANON_KEY).
      - key: AUTH_PROVIDER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Design files: Supabase Storage through its S3-compatible endpoint.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # AI (all optional: without them the app uses rules and templates).
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: IMAGE_PROVIDER
        sync: false
      # Images: IMAGE_PROVIDER=kie or cloudflare (empty = Kie if its key is set,
      # else Cloudflare). IMAGE_MODEL is optional (provider default otherwise).
      - key: IMAGE_MODEL
        sync: false
      - key: KIE_AI_API_KEY
        sync: false
      # Cloudflare Workers AI: account id + an API token with "Workers AI" permission.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # Email (optional): invitations and password reset in local sign-in mode.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
